<style>
/* Portafoli en carpetes · paleta Mineral · Schibsted Grotesk + Hanken Grotesk */
:root{
  --bg:#FFFFFF;
  --fg:#111111;
  --muted:#6A6A6A;
  --line:#E4E4E4;
  --paper:#FFFFFF;
  --ink:#111111;
  --ink-muted:#666666;
  --card-line:#E6E6E6;
  --chip:#F2F2F2;
  --fold-video:#24585E;
  --on-video:#FFFFFF;
  --fold-audio:#9DB08F;
  --on-audio:#1C2418;
  --fold-text:#6A3B57;
  --on-text:#FFFFFF;
  --fold-border:transparent;
  --c-video:#24585E;
  --c-audio:#4F6744;
  --c-text:#6A3B57;
  --display:"Schibsted Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:22px;
  --tab-w:33.4%;
  --tab-step:33.3%;
  --name:clamp(40px,6vw,76px);
  --name-w:800;
  --name-case:none;
  --name-ls:-.012em;
  --overlap:34px;
  --shadow:drop-shadow(0 -6px 14px rgb(0 0 0/.14));
  --maxw:1180px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0E0E0E;
    --fg:#F2F2F2;
    --muted:#9A9A9A;
    --line:#2A2A2A;
    --paper:#1A1A1A;
    --ink:#F2F2F2;
    --ink-muted:#A0A0A0;
    --card-line:#2E2E2E;
    --chip:#262626;
    --fold-video:#1D474C;
    --on-video:#FFFFFF;
    --fold-audio:#5F7155;
    --on-audio:#F1F4EE;
    --fold-text:#55304A;
    --on-text:#FFFFFF;
    --c-video:#8EC3C9;
    --c-audio:#B5CBA6;
    --c-text:#D6A3C2;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0E0E;
  --fg:#F2F2F2;
  --muted:#9A9A9A;
  --line:#2A2A2A;
  --paper:#1A1A1A;
  --ink:#F2F2F2;
  --ink-muted:#A0A0A0;
  --card-line:#2E2E2E;
  --chip:#262626;
  --fold-video:#1D474C;
  --on-video:#FFFFFF;
  --fold-audio:#5F7155;
  --on-audio:#F1F4EE;
  --fold-text:#55304A;
  --on-text:#FFFFFF;
  --c-video:#8EC3C9;
  --c-audio:#B5CBA6;
  --c-text:#D6A3C2;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;transition:background .3s,color .3s}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* selector */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* capçalera */
.hd{padding-block:48px 10px;display:flex;flex-direction:column;gap:44px}
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hd-top .eye{margin:0;text-align:right}
.eye{font:400 19px/1.4 "Martian Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.eye span:first-child{font-weight:700;color:var(--fg)}
.hd h1{font-family:var(--display);font-weight:var(--name-w);font-size:clamp(36px,5.4vw,60px);line-height:.98;letter-spacing:var(--name-ls);margin:0;text-transform:var(--name-case);text-wrap:balance}
.who{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.who-name{font:800 clamp(24px,2.6vw,30px)/1.15 var(--display);letter-spacing:-.012em}
.who-in{font:500 13px/1 var(--body);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);transition:background .2s,border-color .2s}
a.who-in:hover{background:color-mix(in srgb,var(--fg) 6%,transparent);border-color:var(--fg)}
span.who-in{color:var(--muted);border-style:dashed}
@media (max-width:640px){.hd{gap:32px}.hd-top .eye{font-size:16px}}
@media (max-width:520px){.hd-top{flex-direction:column-reverse;align-items:stretch;gap:20px}.hd-top .eye{align-self:flex-end}}
.hd h1{font-weight:800}

/* ---- carpetes ---- */
.pc{display:flex;flex-direction:column;padding-block:30px 40px}
.ft{text-align:center;padding-block:18px 32px;border-top:1px solid var(--line);font:400 13px/1.4 var(--body);color:var(--muted)}
.pc-f{position:relative;filter:var(--shadow);--fold:var(--fold-video)}
.pc-f+.pc-f{margin-top:calc(var(--overlap) * -1)}
.pc-tab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:var(--tab-w);min-width:170px;margin-left:calc(var(--i) * var(--tab-step));padding:12px 16px 11px;border-radius:var(--r) var(--r) 0 0;background:var(--fold);color:var(--on);font:500 14px/1 var(--body);position:relative;top:1.5px;z-index:1;border:1.5px solid var(--fold-border);border-bottom:0}
.pc-tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.pc-tab .n{font:400 12px var(--mono);color:color-mix(in srgb,var(--on) 72%,var(--fold))}
.pc-body{background:var(--fold);color:var(--on);border-radius:0 var(--r) var(--r) var(--r);padding-bottom:calc(var(--overlap) + 10px);border:1.5px solid var(--fold-border)}
.pc-f[style*="--i:1"] .pc-body,.pc-f[style*="--i:2"] .pc-body{border-radius:var(--r)}
.pc-peekw,.pc-openw{display:grid;transition:grid-template-rows .55s var(--ease)}
.pc-peekw{grid-template-rows:1fr}.pc-openw{grid-template-rows:0fr}
.pc-peek,.pc-open{overflow:hidden;min-height:0}
.pc.has-open .pc-peekw{grid-template-rows:0fr}
.pc-f.is-open .pc-openw{grid-template-rows:1fr}
.pc-peekbtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;width:100%;padding:26px 28px 0;align-items:end}
.pc-peekbtn:focus-visible{outline:2px solid var(--fg);outline-offset:-4px}
.pc-name{display:block;font-family:var(--display);font-weight:var(--name-w);font-size:var(--name);line-height:.95;letter-spacing:var(--name-ls);text-transform:var(--name-case)}
.pc-list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:4px;font-size:14px;color:color-mix(in srgb,var(--on) 78%,var(--fold))}
.pc-list li{display:flex;align-items:baseline;gap:8px}
/* marcador: punt petit */
.pc-list li::before{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateY(-3px)}
.pc-papers{position:relative;height:160px;display:block}
.sheet{position:absolute;left:50%;bottom:-26px;width:min(46%,210px);aspect-ratio:16/10;background:var(--paper);border-radius:calc(var(--r) * .5 + 3px);padding:6px;box-shadow:0 8px 22px -12px rgb(0 0 0/.35),0 0 0 1px var(--card-line);transition:transform .5s var(--ease);transform:translateX(calc(-50% + (var(--j) - 1) * 62%)) rotate(calc((var(--j) - 1) * 3deg)) translateY(calc(var(--j) * 6px))}
.pc-peekbtn:hover .sheet{transform:translateX(calc(-50% + (var(--j) - 1) * 66%)) rotate(calc((var(--j) - 1) * 3deg)) translateY(calc(var(--j) * 6px - 16px))}
.sheet .cd-vis{border-radius:calc(var(--r) * .5);height:100%;aspect-ratio:auto}
.pc-in{padding:28px}
.pc-oh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}
.back{all:unset;cursor:pointer;font:500 13px/1 var(--body);padding:9px 14px;border-radius:999px;background:var(--paper);color:var(--ink);border:1px solid var(--card-line)}
.back:hover{filter:brightness(.96)}
.back:focus-visible{outline:2px solid var(--fg)}

/* fitxes */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.cd{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--card-line);border-radius:calc(var(--r) * .6 + 4px);overflow:hidden;background:var(--paper);color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s}
a.cd:hover,.cd.has-cover:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgb(0 0 0/.45)}
.cd.has-cover{position:relative}
.cd-cover{position:absolute;inset:0;z-index:1;border-radius:inherit}
.cd-cover:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cd-acts{display:flex;align-items:center;gap:12px;white-space:nowrap}
.cd-play{color:var(--ink);font-weight:500}
.cd-ext{position:relative;z-index:2;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.cd-ext:hover{text-decoration-thickness:2px}
.cd-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s var(--ease)}
a.cd:hover .cd-img,.cd.has-cover:hover .cd-img{transform:scale(1.03)}
.cd-vis{display:block;aspect-ratio:16/9;max-width:100%;background:color-mix(in srgb,var(--cc) 11%,var(--paper));position:relative;overflow:hidden;color:var(--cc)}
.cd-body{padding:15px 17px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.cd-cli{font:500 11px/1.35 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--cc)}
.cd-ttl{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.cd-note{font-size:13.5px;color:var(--ink-muted)}
.cd-roles{display:flex;flex-wrap:wrap;gap:5px}
.cd-roles span{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--chip);color:var(--ink-muted)}
.cd-foot.sense-any{justify-content:flex-end}
.cd-foot{margin-top:auto;padding-top:11px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;border-top:1px solid var(--card-line);font:400 13.5px/1.3 var(--body);color:var(--ink-muted)}
.cd-open{color:var(--ink);font-weight:500}
.deal>*{animation:deal .55s var(--ease) both}
.deal>*:nth-child(2){animation-delay:.08s}.deal>*:nth-child(3){animation-delay:.16s}
@keyframes deal{from{opacity:0;transform:translateY(22px) rotate(1.5deg)}to{opacity:1;transform:none}}

/* motius */
.m-video{position:absolute;inset:18% 26%;border:1.5px solid currentColor;opacity:.55;border-radius:3px}
.m-video::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-35%,-50%);border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent currentColor}
.m-tc{position:absolute;left:8%;bottom:7%;font:400 10px var(--mono);opacity:.75}
.m-rec{position:absolute;right:8%;top:8%;font:500 9px var(--mono);letter-spacing:.1em;display:flex;align-items:center;gap:5px;opacity:.75}
.m-rec::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.m-wave{position:absolute;inset:26% 8%;display:flex;align-items:center;gap:2px}
.m-wave i{flex:1;background:currentColor;border-radius:2px;opacity:.6}
.m-text{position:absolute;inset:15% 18%;display:flex;flex-direction:column;gap:7%}
.m-text i{height:5px;border-radius:3px;background:currentColor;opacity:.4;flex:none}
.m-text i.h{height:8px;opacity:.65}
.m-text .ph{flex:1;border:1.5px solid currentColor;opacity:.5;border-radius:3px}

/* ---- detalls propis de cada variant ---- */
/* 1 Arxiu: etiqueta enganxada a la pestanya */
/* 2 Pòster: pestanyes a tota l'amplada d'un terç, noms enormes */
.pc-tab{font:600 15px/1 var(--body);padding:16px 22px 14px;min-width:0}
.pc-peekbtn{padding:22px 32px 0;align-items:center}
.pc-papers{height:118px}
.pc-papers .sheet{width:min(38%,180px);bottom:-30px}
.pc-list{font-size:14px;margin-top:10px;gap:2px}
.pc-in{padding:36px}
.pc-oh .pc-name{font-size:clamp(44px,6vw,80px)}
/* 3 Línia: traç fi, sense ombres, fulls només dibuixats */

@media (max-width:760px){
  .pc-peekbtn{grid-template-columns:1fr;padding:22px 20px 0}
  .pc-papers{height:96px}
  .pc-in{padding:20px}
}

/* icona a la pestanya, nom gran a dins */
.ico{display:none}
.ico svg{width:24px;height:24px;display:block}
.pc-tab{width:clamp(88px,14%,140px);justify-content:center;padding:13px 0 12px}
.pc-tab .ico{display:block}
.pc-tab .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .pc-tab{width:72px;margin-left:calc(var(--i) * 30%)}
}

/* previsualització dels enllaços: finestra del lloc de destí */
.pv{position:absolute;inset:12px 14px 0;background:var(--paper);border-radius:8px 8px 0 0;box-shadow:0 0 0 1px var(--card-line),0 -6px 16px -10px rgb(0 0 0/.3);display:flex;flex-direction:column;overflow:hidden;color:var(--ink);transition:transform .35s var(--ease)}
a.cd:hover .pv,.cd.has-cover:hover .pv{transform:translateY(-4px)}
.pv-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--card-line);flex:none}
.pv-bar i{width:6px;height:6px;border-radius:50%;background:var(--card-line);flex:none}
.pv-url{margin-left:6px;flex:1;min-width:0;font:400 10px/1.5 var(--mono);color:var(--ink-muted);background:var(--chip);padding:1px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-video{flex:1;position:relative;background:color-mix(in srgb,var(--cc) 55%,#0d1213);color:#fff}
.pv-video::before{content:"";position:absolute;left:50%;top:44%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgb(255 255 255/.92)}
.pv-video::after{content:"";position:absolute;left:50%;top:44%;transform:translate(-35%,-50%);border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent color-mix(in srgb,var(--cc) 55%,#0d1213)}
.pv-vt{position:absolute;left:10px;right:10px;bottom:8px;font:700 12px/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-audio{flex:1;padding:9px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pv-audio .pv-pt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-wave{flex:1;display:flex;align-items:center;gap:2px;color:var(--cc)}
.pv-wave i{flex:1;background:currentColor;border-radius:2px;opacity:.65}
.pv-page{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pv-site{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cc)}
.pv-pt{font:800 13px/1.2 var(--display);letter-spacing:-.005em}
.pv-page i{height:4px;border-radius:2px;background:var(--card-line);flex:none}
/* reproductor dins la pàgina (vídeo de YouTube o Vimeo, àudio d'iVoox o arxiu .mp3) */
.md{position:fixed;inset:0;z-index:30;background:rgb(10 16 17/.66);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:mdin .2s ease both}
@keyframes mdin{from{opacity:0}to{opacity:1}}
.md-box{width:min(880px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:0 30px 80px -30px rgb(0 0 0/.6);animation:mdup .3s var(--ease) both}
@keyframes mdup{from{transform:translateY(14px) scale(.98)}to{transform:none}}
.md-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 14px}
.md-meta{font:500 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--cc)}
.md-ttl{font:800 clamp(20px,2.4vw,26px)/1.15 var(--display);letter-spacing:-.01em;margin-top:4px}
.md-x{all:unset;cursor:pointer;flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--card-line);font:400 20px/1 var(--body)}
.md-x:hover{background:var(--chip)}
.md-x:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.md-media{background:#0d1213}
.md-media.video{aspect-ratio:16/9}
.md-media.ivoox{height:200px;background:var(--chip)}
.md-media.audio{background:color-mix(in srgb,var(--cc) 12%,var(--paper));padding:22px 18px}
.md-media iframe{display:block;width:100%;height:100%;border:0}
.md-media audio{display:block;width:100%}
.md-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 18px;font-size:13.5px;color:var(--ink-muted)}
.md-foot a{color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.md-foot a:hover{text-decoration:underline}
/* carpeta tancada: nom en una línia i fulls fins a la vora de baix */
@media (min-width:761px){.pc-peekbtn{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media (min-width:1000px){.pc-peek .pc-name{white-space:nowrap}}
.pc-peekw{transition:grid-template-rows .55s var(--ease),margin-bottom .55s var(--ease)}
.pc:not(.has-open) .pc-peekw{margin-bottom:calc((var(--overlap) + 10px) * -1)}
.pc-peekbtn>span:first-child{padding-bottom:calc(var(--overlap) + 10px)}
.pc-papers{align-self:end}
/* butxaca: franja inferior de la carpeta, més fosca, on entren les fitxes */
.pc-body{position:relative}
.pc-peek{position:relative;z-index:0}
.pc:not(.has-open) .pc-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--overlap) + 10px);background:color-mix(in srgb,var(--fold) 84%,#000);border-radius:0 0 var(--r) var(--r);box-shadow:inset 0 1px 0 rgb(255 255 255/.14),0 -6px 12px -8px rgb(0 0 0/.35);z-index:1;pointer-events:none}
.pc-papers{height:176px}
.pc-papers .sheet{width:min(42%,230px);bottom:20px}
@media (max-width:760px){
  .pc-peekbtn{gap:10px}
  .pc-papers{height:112px}
  .pc-papers .sheet{width:min(44%,160px);bottom:18px}
}
@media (max-width:760px){.pc-peekbtn>span:first-child{padding-bottom:6px}}
.pc-h{margin:0;font:inherit}
/* carpetes plegades: la pestanya mostra icona i nom */
.pc.has-open .pc-f:not(.is-open) .pc-tab{width:auto;justify-content:flex-start;gap:8px;padding-inline:18px;white-space:nowrap}
.pc.has-open .pc-f:not(.is-open) .pc-tab .lab{position:static;width:auto;height:auto;overflow:visible;clip:auto}
@media (max-width:760px){
  .pc.has-open .pc-f:not(.is-open) .pc-tab{width:max-content;padding-inline:14px;font-size:14px;margin-left:calc(var(--i) * 50%);transform:translateX(calc(var(--i) * -50%))}
  .pc.has-open .pc-f:not(.is-open)[style*="--i:2"] .pc-body{border-top-right-radius:0}
}
/* botons més alts per tocar-los amb el dit */
.who-in{min-height:36px;box-sizing:border-box;padding-inline:14px}
.back{min-height:36px;box-sizing:border-box;display:inline-flex;align-items:center}
@media (pointer:coarse),(max-width:760px){.who-in,.back{min-height:44px;padding-inline:16px;font-size:14px}}
/* ajustos finals de tipografia */

function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%1000)/1000}}
function motif(it){
  const r=seeded(it.title);
  if(it.cat==="video"){
    const tc=["00",Math.floor(r()*6),Math.floor(r()*60),Math.floor(r()*25)].map(n=>String(n).padStart(2,"0")).join(":");
    return `<span class="m-rec">REC</span><span class="m-video"></span><span class="m-tc">${tc}</span>`;
  }
  if(it.cat==="audio"){
    let b="";for(let i=0;i<40;i++){const e=Math.sin(Math.PI*i/39)*.7+.3;b+=`<i style="height:${Math.round((15+r()*85)*e)}%"></i>`}
    return `<span class="m-wave">${b}</span>`;
  }
  let l=`<i class="h" style="width:70%"></i>`;
  if(it.photo)l+=`<span class="ph"></span>`;
  for(let i=0;i<(it.photo?2:5);i++)l+=`<i style="width:${55+Math.round(r()*45)}%"></i>`;
  return `<span class="m-text">${l}</span>`;
}

    return `<span class="pv">${bar}<span class="pv-audio"><span class="pv-site">${esc(it.client)}</span><span class="pv-wave">${b}</span><span class="pv-pt">${esc(it.title)}</span></span></span>`;}

function card(it){
  const em=it.url&&CONFIG.incrustar?embedOf(it.url):null;
  const inner=`<span class="cd-vis" aria-hidden="true">${it.url?preview(it):motif(it)}${it.img&&it.img.trim()?`<img class="cd-img" src="${esc(it.img.trim())}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>
    <span class="cd-body">
      <span class="cd-cli">${esc(it.client)}</span>
      <span class="cd-ttl" role="heading" aria-level="3">${esc(it.title)}</span>
      ${it.note?`<span class="cd-note">${esc(it.note)}</span>`:""}
      <span class="cd-roles">${it.roles.map(x=>`<span>${esc(x)}</span>`).join("")}</span>
      ${foot(it,em)}
    </span>`;
  if(em)return `<div class="cd has-cover"><a class="cd-cover" href="${esc(it.url)}" target="_blank" rel="noopener" data-i="${ITEMS.indexOf(it)}" aria-label="Reprodueix ${esc(it.title)}"></a>${inner}</div>`;
  return it.url?`<a class="cd" href="${esc(it.url)}" target="_blank" rel="noopener" data-i="${ITEMS.indexOf(it)}">${inner}</a>`:`<div class="cd">${inner}</div>`;
}

function render(){
  stage.innerHTML=`<div class="wrap">
  <header class="hd">
    <div class="hd-top"><div class="who"><span class="who-name">${esc(PERSONA.nom)}</span>${PERSONA.linkedin.trim()?`<a class="who-in" href="${esc(PERSONA.linkedin.trim())}" target="_blank" rel="noopener">LinkedIn ↗</a>`:`<span class="who-in">LinkedIn</span>`}</div><p class="eye"><span>PER A AGÈNCIA CATALANA DE NOTÍCIES</span><br><span>REDACTORA MULTIMÈDIA – MOSTRES</span></p></div>
    <h1>Vídeo, àudio, text i fotografia</h1>
  </header>
  <div class="pc" id="pc">${KEYS.map((k,i)=>`
    <section class="pc-f" data-k="${k}" style="--fold:var(--fold-${k});--on:var(--on-${k});--cc:var(--c-${k});--i:${i}">
      <h2 class="pc-h"><button class="pc-tab" id="pc-tab-${k}" aria-expanded="false" aria-controls="pc-open-${k}"><span class="ico" aria-hidden="true">${ICO[k]}</span><span class="lab">${CATS[k]}</span></button></h2>
      <div class="pc-body">
        <div class="pc-peekw"><div class="pc-peek">
          <button class="pc-peekbtn" tabindex="-1" aria-hidden="true">
            <span><span class="pc-name">${CATS[k]}</span><ul class="pc-list">${byCat(k).map(it=>`<li>${esc(it.title)}</li>`).join("")}</ul></span>
            <span class="pc-papers">${sheets(k)}</span>
          </button>
        </div></div>
        <div class="pc-openw"><div class="pc-open" id="pc-open-${k}" inert><div class="pc-in">
          <div class="pc-oh"><div><span class="pc-name">${CATS[k]}</span></div><button class="back" data-close>Tanca la carpeta</button></div>
          <div class="grid n${byCat(k).length}">${byCat(k).map(card).join("")}</div>
        </div></div></div>
      </div>
    </section>`).join("")}</div>
  <footer class="ft">${esc(PEU.any)} · ${esc(PEU.autoria)}</footer></div>`;
  const pc=document.getElementById("pc");
  const set=k=>{
    pc.classList.toggle("has-open",!!k);
    pc.querySelectorAll(".pc-f").forEach(f=>{
      const o=f.dataset.k===k;f.classList.toggle("is-open",o);
      f.querySelector(".pc-tab").setAttribute("aria-expanded",o);
      f.querySelector(".pc-open").inert=!o;
      const g=f.querySelector(".grid");g.classList.remove("deal");if(o){void g.offsetWidth;g.classList.add("deal")}
    });
    if(k)document.getElementById("pc-tab-"+k).scrollIntoView({block:"nearest",behavior:"smooth"});
  };
  pc.querySelectorAll(".pc-tab").forEach(b=>b.onclick=()=>{const k=b.closest(".pc-f").dataset.k;set(b.getAttribute("aria-expanded")==="true"?null:k)});
  pc.querySelectorAll(".pc-peekbtn").forEach(b=>b.onclick=()=>set(b.closest(".pc-f").dataset.k));
  pc.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{const k=b.closest(".pc-f").dataset.k;set(null);document.getElementById("pc-tab-"+k).focus()});
  closeCurrent=()=>{if(pc.classList.contains("has-open"))set(null)};
}

render();
/* ---------- reproductor ---------- */
function embedOf(url){
  let u;try{u=new URL(url)}catch(e){return null}
  const host=u.hostname.replace(/^(www|m)\./,"");
  if(host==="youtube.com"||host==="youtube-nocookie.com"||host==="youtu.be"){
    let id=host==="youtu.be"?u.pathname.slice(1):u.searchParams.get("v");
    if(!id){const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/);if(m)id=m[1]}
    if(!id)return null;
    const list=u.searchParams.get("list");
    return {kind:"video",site:"Obre a YouTube",src:`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0${list?"&list="+encodeURIComponent(list):""}`};
  }
  if(host==="vimeo.com"||host==="player.vimeo.com"){
    const m=u.pathname.match(/^\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/);if(!m)return null;
    const h=m[2]||u.searchParams.get("h");
    return {kind:"video",site:"Obre a Vimeo",src:`https://player.vimeo.com/video/${m[1]}?autoplay=1${h?"&h="+h:""}`};
  }
  if(host==="ivoox.com"||host.endsWith(".ivoox.com")){
    const m=url.match(/_(?:rf|ej)_(\d+)_/);if(!m)return null;
    return {kind:"ivoox",site:"Obre a iVoox",src:`https://www.ivoox.com/player_ej_${m[1]}_4_1.html`};
  }
  if(/\.(mp3|m4a|aac|ogg|oga|wav)$/i.test(u.pathname))return {kind:"audio",site:"Obre l’arxiu",src:url};
  return null;
}
let media=null;
function openMedia(it,em,from){
  const el=document.createElement("div");
  el.className="md";el.style.setProperty("--cc",`var(--c-${it.cat})`);
  el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",it.title);
  const player=em.kind==="audio"
    ?`<audio controls autoplay preload="none" src="${esc(em.src)}"></audio>`
    :`<iframe src="${esc(em.src)}" title="${esc(it.title)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>`;
  el.innerHTML=`<div class="md-box">
    <div class="md-head"><div><div class="md-meta">${esc(it.client)}${CONFIG.mostrarAnys?" · "+it.year:""}</div><div class="md-ttl">${esc(it.title)}</div></div>
      <button class="md-x" id="md-x" aria-label="Tanca">×</button></div>
    <div class="md-media ${em.kind}">${player}</div>
    <div class="md-foot"><span>${it.note?esc(it.note):""}</span><a href="${esc(it.url)}" target="_blank" rel="noopener">${em.site} ↗</a></div>
  </div>`;
  el.addEventListener("click",e=>{if(e.target===el)closeMedia()});
  el.addEventListener("keydown",e=>{
    if(e.key!=="Tab")return;
    const f=[...el.querySelectorAll("button,a[href],iframe,audio")];if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
  stage.inert=true;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  el.querySelector("#md-x").onclick=closeMedia;el.querySelector("#md-x").focus();
  media={el,from};
}
function closeMedia(){
  if(!media)return;
  media.el.remove();document.body.style.overflow="";stage.inert=false;
  const f=media.from;media=null;if(f)f.focus();
}
document.addEventListener("click",e=>{
  if(!CONFIG.incrustar||e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0)return;
  const a=e.target.closest("a.cd-cover[data-i]");if(!a)return;
  const it=ITEMS[+a.dataset.i],em=embedOf(it.url);if(!em)return;
  e.preventDefault();openMedia(it,em,a);
});
addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(media){closeMedia();return}if(closeCurrent)closeCurrent()});
</script>
